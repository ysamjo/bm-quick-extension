<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Brickmerge-Suche</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <form id="search-form">
      <label class="visually-hidden" for="query">Setnummer oder Suchbegriff</label>
      <div class="search-row">
        <input id="query" name="query" type="search" autocomplete="off" autofocus required placeholder="Setnummer oder Suchbegriff">
        <button type="submit" title="Brickmerge-Suche starten">Suchen</button>
      </div>
    </form>
    <button id="open-options" class="settings" type="button" title="Einstellungen" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <line x1="21" x2="14" y1="4" y2="4"></line>
        <line x1="10" x2="3" y1="4" y2="4"></line>
        <line x1="21" x2="12" y1="12" y2="12"></line>
        <line x1="8" x2="3" y1="12" y2="12"></line>
        <line x1="21" x2="16" y1="20" y2="20"></line>
        <line x1="12" x2="3" y1="20" y2="20"></line>
        <line x1="14" x2="14" y1="2" y2="6"></line>
        <line x1="8" x2="8" y1="10" y2="14"></line>
        <line x1="16" x2="16" y1="18" y2="22"></line>
      </svg>
    </button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
