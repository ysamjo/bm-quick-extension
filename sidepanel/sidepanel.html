<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Brickmerge Tools</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="app-header">
    <img src="../icons/icon48.png" width="36" height="36" alt="">
    <div>
      <h1>Brickmerge Tools</h1>
      <p id="page-host">Aktive Seite wird geprüft …</p>
    </div>
    <button id="rescan" class="square-button" type="button" title="Aktive Seite erneut prüfen" aria-label="Aktive Seite erneut prüfen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"></path><path d="M20 4v7h-7"></path></svg>
    </button>
  </header>

  <main>
    <section id="status-card" class="status-card" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span id="status-text">LEGO-Set wird erkannt …</span>
    </section>

    <section id="browser-view" class="browser-view" hidden>
      <iframe id="brickmerge-frame" title="Mobile Brickmerge-Detailseite"></iframe>
    </section>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
