<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Brickmerge Tools</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="app-header">
    <img src="../icons/icon48.png" width="36" height="36" alt="">
    <div>
      <h1>Brickmerge Tools</h1>
      <p id="page-host">Aktive Seite wird geprüft …</p>
    </div>
    <button id="rescan" class="square-button" type="button" title="Aktive Seite erneut prüfen" aria-label="Aktive Seite erneut prüfen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"></path><path d="M20 4v7h-7"></path></svg>
    </button>
  </header>

  <main>
    <section id="status-card" class="status-card" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span id="status-text">LEGO-Set wird erkannt …</span>
    </section>

    <form id="manual-form" class="manual-form" hidden>
      <label for="manual-query">Setnummer, EAN oder Suchbegriff</label>
      <div>
        <input id="manual-query" type="search" autocomplete="off" placeholder="z. B. 42154" required>
        <button type="submit">Suchen</button>
      </div>
    </form>

    <section id="product" class="product-card" hidden>
      <img id="product-image" class="product-image" alt="" hidden>
      <div class="product-content">
        <h2 id="product-name"></h2>
        <div class="identifiers">
          <span>Set <strong id="set-number"></strong><button class="copy-button" data-copy="set" type="button" title="Setnummer kopieren" aria-label="Setnummer kopieren">▢</button></span>
          <span id="ean-row">EAN <strong id="ean"></strong><button class="copy-button" data-copy="ean" type="button" title="EAN kopieren" aria-label="EAN kopieren">▢</button></span>
        </div>
        <div class="brickmerge-price-row">
          <span>Brickmerge</span>
          <strong id="brickmerge-price">–</strong>
          <span id="brickmerge-discount" class="discount" hidden></span>
        </div>
        <a id="brickmerge-link" class="text-link" href="#">Bei Brickmerge öffnen ↗</a>
      </div>
    </section>

    <section id="offers-section" hidden>
      <div class="section-heading">
        <div>
          <h2>Preise im Cache</h2>
          <p id="cache-summary"></p>
        </div>
      </div>
      <div id="offers" class="offers"></div>
      <button id="refresh-offers" class="refresh-offers" type="button">
        <span class="plus" aria-hidden="true">+</span>
        <span class="refresh-label">Weitere Marktplätze abrufen</span>
      </button>
      <p class="cost-note">Nur dieser manuelle Abruf kann Apify-Guthaben verbrauchen.</p>
    </section>

    <section id="links-section" hidden>
      <h2>Direkt suchen</h2>
      <div id="marketplace-links" class="marketplace-links"></div>
    </section>
  </main>

  <script src="../platform-config.js"></script>
  <script src="../shared.js"></script>
  <script src="sidepanel-core.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
