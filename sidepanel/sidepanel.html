<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Brickmerge Tools</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main>
    <section id="status-card" class="status-card" aria-live="polite">
      <form id="panel-search-form" class="panel-search-form">
        <label class="visually-hidden" for="panel-query">Setnummer, EAN oder Suchbegriff</label>
        <input id="panel-query" type="search" autocomplete="off"
               placeholder="Setnummer, EAN oder Suchbegriff">
        <button type="submit" title="Brickmerge-Suche starten"
                aria-label="Brickmerge-Suche starten">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.2"></circle>
            <path d="m16 16 5 5"></path>
          </svg>
        </button>
      </form>
      <span class="spinner" aria-hidden="true"></span>
      <span id="status-text" class="status-message"></span>
    </section>

    <section id="browser-view" class="browser-view" hidden>
      <iframe id="brickmerge-frame" title="Mobile Brickmerge-Detailseite"></iframe>
    </section>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
